data:
  raw_audio_dir: "data/raw_audio"
  processed_npy_dir: "data/processed_spectrograms"
  metadata_dir: "data/metadata"
  data_csv: "data/birds_voices.csv"
  num_classes: 10
  num_samples_per_class: 50
  label_column: "scientific_name_id"

audio:
  sr: 32000
  n_fft: 2048
  hop_length: 512
  n_mels: 128
  segment_seconds: 3
  min_db: -80.0
  max_db: 0.0

model:
  embed_dim: 256
  num_layers: 6
  heads: 8
  patch_size: 25
  forward_expansion: 4
  dropout: 0.1

training:
  batch_size: 32
  epochs: 500
  learning_rate: 0.0001
  device: "cuda"  # Options: "cuda", "cpu", "mps"
  num_workers: 2
  weight_decay: 0.01
  gradient_clip: 1.0
  compile_model: false  # Set true to use torch.compile() on PyTorch 2.x
  patience: 100          # Early stopping patience (epochs without improvement)

  # === Mixed Precision Configuration ===
  mixed_precision:
    enabled: true
    use_bfloat16: false  # Set true for modern GPUs (Ampere/Ada/Hopper)

  # === Scheduler Configuration ===
  scheduler_type: "cosine"  # Options: constant, cosine, linear_decay, cosine_warm_restarts, reduce_on_plateau, one_cycle
  warmup_steps: 500         # Linear warmup steps (0 = no warmup)
  min_lr: 1.0e-6            # Minimum learning rate for decay schedulers

augmentation:
  enabled: true
  prob: 0.5
  num_freq_masks: 2
  freq_mask_param: 6
  num_time_masks: 2
  time_mask_param: 10

logging:
  use_wandb: true
  wandb_project: "bird-song-classifier"
  wandb_run_name: null  # Dynamically set by ExperimentManager
  wandb_run_id: null    # Dynamically set by ExperimentManager

# === Windowing Configuration ===
window:
  strategy: "sliding" # Options: sliding, random, center
  stride: 256

# === Acoustic Augmentation Configuration ===
acoustic_augmentation:
  enabled: true
  noise_level: 0.05 # Gaussian noise std in [0,1] range
  noise_prob: 1.0 # Probability of applying noise

# === SSL Training Specific ===
ssl:
  temperature: 0.07 # NT-Xent temperature tau
  projection_dim: 128
  projection_hidden_dim: 256
